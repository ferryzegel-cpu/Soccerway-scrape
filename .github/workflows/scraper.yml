name: Scrape Dutch Football Squads

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # elke maandag 06:00

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Code ophalen
        uses: actions/checkout@v4

      - name: 🐍 Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Packages installeren
        run: pip install requests beautifulsoup4 lxml openpyxl

      - name: ⚽ Scraper uitvoeren
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python soccerway_squads.py --output squads.xlsx

      - name: 💾 Excel opslaan als artifact
        uses: actions/upload-artifact@v4
        with:
          name: nederland-voetbal-squads
          path: squads.xlsx
          retention-days: 30
